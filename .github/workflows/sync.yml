name: sync-market-data

# Actualiza dolar y acciones argentinas en Supabase.
# El script decide internamente si el mercado esta abierto (data912) —
# el dolar se guarda siempre. Repo publico => minutos de Actions ilimitados.

on:
  schedule:
    # Solo en horario "de dia": 07:00–18:00 ART (UTC-3) => 10:00–21:00 UTC.
    # De noche no corre (no hace falta actualizar mientras Joaquin duerme).
    - cron: '*/15 10-20 * * *' # cada 15 min, 07:00–17:45 ART
    - cron: '0 21 * * *'       # corrida final 18:00 ART
  workflow_dispatch: {} # permite correrlo a mano desde la pestaña Actions

# Evita que dos corridas se pisen.
concurrency:
  group: sync-market-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run sync
        run: npm run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
